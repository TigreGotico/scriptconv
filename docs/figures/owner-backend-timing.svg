<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-labelledby="t d">
<title id="t">Time to phonemize 10,000 characters</title>
<desc id="d">Median milliseconds for one read of about 10,000 characters of prose, in two runs, on a log scale: shami 87 and 76 ms; dizione 297 and 179 ms; euskaphone 406 and 426 ms; tugaphone 637 and 674 ms; arbtok 9,399 and 8,001 ms.</desc>
<rect x="16" y="14" width="16" height="16" fill="#4C8DD6"/>
<text x="40" y="28" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">run 1</text>
<rect x="126" y="14" width="16" height="16" fill="#E0883A"/>
<text x="150" y="28" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">run 2</text>
<line x1="130.0" y1="44" x2="130.0" y2="332" stroke="#80808055"/>
<text x="130.0" y="350" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">10 ms</text>
<line x1="293.6" y1="44" x2="293.6" y2="332" stroke="#80808055"/>
<text x="293.6" y="350" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">100 ms</text>
<line x1="457.3" y1="44" x2="457.3" y2="332" stroke="#80808055"/>
<text x="457.3" y="350" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">1,000 ms</text>
<line x1="620.9" y1="44" x2="620.9" y2="332" stroke="#80808055"/>
<text x="620.9" y="350" text-anchor="middle" fill="#808080" font-family="sans-serif" font-size="15">10,000 ms</text>
<text x="120" y="82" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">shami</text>
<rect x="130" y="52" width="153.4" height="20" fill="#4C8DD6"/>
<text x="291.4" y="68" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">87 ms</text>
<rect x="130" y="76" width="143.7" height="20" fill="#E0883A"/>
<text x="281.7" y="92" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">76 ms</text>
<text x="120" y="138" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">dizione</text>
<rect x="130" y="108" width="241.0" height="20" fill="#4C8DD6"/>
<text x="379.0" y="124" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">297 ms</text>
<rect x="130" y="132" width="205.0" height="20" fill="#E0883A"/>
<text x="343.0" y="148" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">179 ms</text>
<text x="120" y="194" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">euskaphone</text>
<rect x="130" y="164" width="263.2" height="20" fill="#4C8DD6"/>
<text x="401.2" y="180" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">406 ms</text>
<rect x="130" y="188" width="266.6" height="20" fill="#E0883A"/>
<text x="404.6" y="204" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">426 ms</text>
<text x="120" y="250" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">tugaphone</text>
<rect x="130" y="220" width="295.3" height="20" fill="#4C8DD6"/>
<text x="433.3" y="236" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">637 ms</text>
<rect x="130" y="244" width="299.2" height="20" fill="#E0883A"/>
<text x="437.2" y="260" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">674 ms</text>
<text x="120" y="306" text-anchor="end" fill="#808080" font-family="sans-serif" font-size="15">arbtok</text>
<rect x="130" y="276" width="486.5" height="20" fill="#4C8DD6"/>
<text x="624.5" y="292" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">9,399 ms</text>
<rect x="130" y="300" width="475.1" height="20" fill="#E0883A"/>
<text x="613.1" y="316" text-anchor="start" fill="#808080" font-family="sans-serif" font-size="15">8,001 ms</text>
</svg>
