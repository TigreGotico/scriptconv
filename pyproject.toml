[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptconv"
dynamic = ["version", "dependencies"]
description = "Zero-dependency script & phoneme-notation core — ISO-15924 detection & metadata, IPA↔ARPABET/X-SAMPA/Lexique/Kirshenbaum/Cotovía/RFE, Buckwalter↔Arabic, Hangul→jamo, kana"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
keywords = [
    "ipa", "arpabet", "x-sampa", "kirshenbaum", "cotovia", "rfe", "lexique",
    "buckwalter", "hangul", "jamo", "kana", "transliteration", "notation",
    "phoneme", "phonetic-alphabet", "script", "iso15924", "unicode", "tts", "g2p",
]

[tool.setuptools.dynamic]
version = {attr = "scriptconv.version.VERSION_STR"}
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
ja = ["pykakasi>=2.3,<3"]
zh = ["pypinyin>=0.50,<1"]
# Assyriological readings -> cuneiform signs. Installed for its bundled sign
# table only; scriptconv locates the data file rather than importing the
# package, whose top level pulls in torch and transformers.
cuneiscribe = ["cuneiscribe>=0.2"]
# --- phonemizer wrappers (scriptconv.phonemizers) ---
phonemizers = ["quebra-frases", "langcodes"]
espeak = ["scriptconv[phonemizers]", "espyak"]
gruut = ["scriptconv[phonemizers]", "gruut"]
goruut = ["scriptconv[phonemizers]", "pygoruut"]
epitran = ["scriptconv[phonemizers]", "epitran"]
transphone = ["scriptconv[phonemizers]", "transphone"]
misaki = ["scriptconv[phonemizers]", "misaki"]
byt5 = ["scriptconv[phonemizers]", "onnxruntime", "numpy"]
o2i = ["scriptconv[phonemizers]", "orthography2ipa"]
eu = ["scriptconv[phonemizers]", "euskaphone", "ahotts_g2p"]
pt-phonemizers = ["scriptconv[phonemizers]", "tugaphone", "g2p_barranquenho"]
mwl = ["scriptconv[phonemizers]", "mwl_phonemizer"]
gl = ["scriptconv[phonemizers]", "pycotovia"]
he = ["scriptconv[phonemizers]", "phonikud-onnx", "phonikud"]
fa = ["scriptconv[phonemizers]", "persian_phonemizer"]
vi = ["scriptconv[phonemizers]", "viphoneme"]
tashkeel = ["scriptconv[phonemizers]", "text2tashkeel"]
stress = ["scriptconv[phonemizers]", "stressonnx>=0.0.3a2"]
pt = ["scriptconv[phonemizers]", "bifonia>=0.1.1"]
ja-phonemizers = ["scriptconv[phonemizers]", "pyopenjtalk", "cutlet", "pykakasi>=2.3,<3"]
ko = ["scriptconv[phonemizers]", "g2pk", "regex"]
zh-phonemizers = ["scriptconv[phonemizers]", "jieba", "pypinyin>=0.50,<1", "xpinyin", "g2pM", "pinyin_to_ipa"]
en-phonemizers = ["scriptconv[phonemizers]", "g2p_en", "openphonemizer", "deep-phonemizer", "requests"]
ar-phonemizers = ["scriptconv[phonemizers]", "arbtok", "ovos-number-parser"]
shami = ["scriptconv[phonemizers]", "regex"]
test = ["pytest", "pytest-timeout", "pykakasi>=2.3,<3", "pypinyin>=0.50,<1", "quebra-frases", "langcodes", "regex", "ovos-number-parser", "bifonia>=0.1.1", "stressonnx>=0.0.3a2", "tomli; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/TigreGotico/scriptconv"
Issues = "https://github.com/TigreGotico/scriptconv/issues"

[tool.setuptools.packages.find]
include = ["scriptconv*"]

[tool.setuptools.package-data]
scriptconv = ["py.typed"]
"scriptconv.data" = ["*.tsv.gz"]
"scriptconv.phonemizers._thirdparty" = ["ko_tables/*.csv", "ko_tables/*.tsv"]
"scriptconv.phonemizers._vendored.kog2p" = ["rulebook.txt", "LICENSE.md"]
"scriptconv.phonemizers._vendored.mantoq" = ["LICENSE.md"]
"scriptconv.phonemizers._vendored.iqra_phonetiser" = ["LICENSE.md"]
"scriptconv.phonemizers._vendored.africa_g2p" = [
    "LICENSE.md", "DATA_LICENSE.md",
    "languages/*.json", "data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
