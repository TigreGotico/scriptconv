[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptconv"
dynamic = ["version"]
description = "The one stop for text conversion: a zero-dependency script & phoneme-notation core — ISO-15924 detection & metadata, IPA↔ARPABET/X-SAMPA/Lexique/Kirshenbaum/Cotovía/RFE, Buckwalter↔Arabic, Hangul→jamo, kana — with phonemizer integrations behind optional extras"
readme = "README.md"
license = "Apache-2.0 AND MIT AND LicenseRef-CMUdict"
license-files = [
    "LICENSE",
    "scriptconv/data/LICENSE.cangjie5",
    "scriptconv/phonemizers/_thirdparty/LICENSE.f5tts",
    "scriptconv/phonemizers/_thirdparty/LICENSE.hangul_to_ipa",
    "scriptconv/phonemizers/_thirdparty/dizione/LICENSE",
    "scriptconv/phonemizers/_thirdparty/dizione/built/LICENSE.cmudict",
    "scriptconv/phonemizers/_thirdparty/dizione/built/LICENSE.homograph-data",
    "scriptconv/phonemizers/_vendored/matoub_kab/LICENSE.md",
    "scriptconv/phonemizers/_thirdparty/g2pw/LICENSE",
    "scriptconv/phonemizers/_thirdparty/leokani/LICENSE",
    "scriptconv/phonemizers/_thirdparty/leokani/NOTICE",
    "scriptconv/phonemizers/_thirdparty/leokani/LICENSE-CC-BY-4.0.txt",
    "scriptconv/phonemizers/_thirdparty/nakdimon/LICENSE",
    "scriptconv/phonemizers/_thirdparty/nemo/NOTICE",
]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
keywords = [
    "ipa", "arpabet", "x-sampa", "kirshenbaum", "cotovia", "rfe", "lexique",
    "buckwalter", "hangul", "jamo", "kana", "transliteration", "notation",
    "phoneme", "phonetic-alphabet", "script", "iso15924", "unicode", "tts", "g2p",
]

[tool.setuptools.dynamic]
version = {attr = "scriptconv.version.VERSION_STR"}

[project.optional-dependencies]
ja = ["scriptconv-copyleft[ja]>=0.1.2a1"]
zh = ["pypinyin>=0.50,<1"]
# --- phonemizer wrappers (scriptconv.phonemizers) ---
phonemizers = ["quebra-frases>=0.3.8a4", "linguatag[langcodes]>=0.4.2a4"]
normalize = ["text2spoken[pt]>=0.0.2a137"]
espeak = ["scriptconv[phonemizers]", "scriptconv-copyleft[espeak]>=0.2.0a1"]
gruut = ["scriptconv[phonemizers]", "gruut"]
goruut = ["scriptconv[phonemizers]", "pygoruut"]
epitran = ["scriptconv[phonemizers]", "epitran>=1.26.1"]
transphone = ["scriptconv[phonemizers]", "scriptconv-copyleft[transphone]>=0.1.2a1"]
phonetisaurus = ["scriptconv[phonemizers]", "phonetisaurus"]
misaki = ["scriptconv[phonemizers]", "scriptconv-copyleft[misaki]>=0.2.0a1"]
byt5 = ["scriptconv[phonemizers]", "onnxruntime", "numpy"]
o2i = ["scriptconv[phonemizers]", "orthography2ipa>=7.126.2a2", "o2i-lexicons>=0.7.0a1"]
eu = ["scriptconv[phonemizers]", "euskaphone>=0.3.5a1", "scriptconv-copyleft[eu]>=0.1.2a1"]
pt-phonemizers = ["scriptconv[phonemizers]", "tugaphone>=1.10.0a1"]
mwl = ["scriptconv[o2i]"]
ghana = ["scriptconv[phonemizers]", "scriptconv-nonfree[ghana]>=0.1.0a1"]
africa = ["scriptconv[phonemizers]", "scriptconv-nonfree[africa]>=0.1.0a1"]
gl = ["scriptconv[phonemizers]", "scriptconv-copyleft[gl]>=0.1.2a1"]
# tokenizers<1: phonikud-onnx 1.0.6 calls Tokenizer.encode and reads Encoding.offsets, which tokenizers 1.0 removed.
he = ["scriptconv[phonemizers]", "phonikud-onnx", "phonikud", "onnxruntime>=1.17", "numpy", "tokenizers<1", "scriptconv-copyleft>=0.3.0a1"]
fa = ["scriptconv[phonemizers]", "scriptconv-copyleft[fa]>=0.1.2a1"]
vi = ["scriptconv[phonemizers]", "scriptconv-nonfree[vi]>=0.1.0a1"]
tashkeel = ["scriptconv[phonemizers]", "text2tashkeel>=0.2.0a1"]
stress = ["scriptconv[phonemizers]", "stressonnx>=0.0.3a2"]
pt = ["scriptconv[phonemizers]", "bifonia>=0.3.0a1"]
ja-phonemizers = ["scriptconv[phonemizers]", "pyopenjtalk-plus[onnxruntime]>=0.4.1.post10", "cutlet", "unidic-lite", "scriptconv-copyleft[ja-phonemizers]>=0.3.0a1"]
ko = ["scriptconv[phonemizers]", "scriptconv-copyleft[ko]>=0.1.2a1"]
th = ["scriptconv[phonemizers]", "scriptconv-copyleft[th]>=0.3.0a1"]
zh-phonemizers = ["scriptconv[phonemizers]", "jieba", "rjieba>=0.2.2", "pypinyin>=0.50,<1", "xpinyin", "g2pM", "numpy", "pinyin_to_ipa", "onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.25"]
en-phonemizers = ["scriptconv[phonemizers]", "g2p_en", "openphonemizer", "deep-phonemizer", "requests", "numpy>=1.24,<3", "onnxruntime>=1.17", "huggingface_hub>=0.25"]
lir = ["scriptconv[phonemizers]", "onnxruntime>=1.17", "numpy", "huggingface_hub>=0.25"]
ar-phonemizers = ["scriptconv[phonemizers]", "arbtok", "scriptconv-nonfree[ar-phonemizers]>=0.1.0a1"]
shami = ["scriptconv[phonemizers]", "regex"]
test = ["pytest", "pytest-timeout", "gruut[ca,fr,ru]", "scriptconv-copyleft[espeak,ja,ja-phonemizers,th]>=0.3.0a1", "pyopenjtalk-plus[onnxruntime]>=0.4.1.post10", "scriptconv-nonfree[ar-phonemizers]>=0.1.0a1", "jieba", "rjieba>=0.2.2", "pypinyin>=0.50,<1", "pinyin_to_ipa", "xpinyin", "g2pM", "numpy", "onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.25", "quebra-frases>=0.3.8a4", "linguatag[langcodes]>=0.4.2a4", "scriptconv[normalize]", "text2spoken>=0.0.2a137", "ovos-utils>=0.1.0", "regex", "bifonia>=0.3.0a1", "stressonnx>=0.0.3a2", "text2tashkeel>=0.2.0a1", "tugaphone>=1.10.0a1", "epitran>=1.26.1", "orthography2ipa>=7.126.2a2", "o2i-lexicons>=0.7.0a1", "euskaphone>=0.3.5a1", "pygoruut", "packaging", "setuptools>=77.0", "tomli; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/TigreGotico/scriptconv"
Issues = "https://github.com/TigreGotico/scriptconv/issues"

[tool.setuptools.packages.find]
include = ["scriptconv*"]

[tool.setuptools.package-data]
scriptconv = ["py.typed"]
"scriptconv.data" = ["*.tsv.gz"]
"scriptconv.phonemizers._thirdparty" = ["ko_tables/*.csv", "ko_tables/*.tsv"]
"scriptconv.phonemizers._thirdparty.g2pw" = ["*.json", "*.txt"]
"scriptconv.phonemizers._thirdparty.dizione" = ["data/*.txt", "built/*", "UPSTREAM.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that hangs fails after this many seconds. The slowest test, 40,000 digits through espeak-ng,
# took 49.7 s at load average 31 to 35.
timeout = 150
